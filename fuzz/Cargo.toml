[package]
name = "argus-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
argus-core = { path = "../crates/argus-core", features = ["fuzzing"] }

# Not part of the main workspace (needs nightly + libFuzzer).
[workspace]
members = ["."]

[[bin]]
name = "parse_file"
path = "fuzz_targets/parse_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_inner"
path = "fuzz_targets/decode_inner.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_totp"
path = "fuzz_targets/parse_totp.rs"
test = false
doc = false
bench = false
