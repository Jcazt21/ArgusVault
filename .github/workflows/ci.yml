name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, test, lint (Windows)
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-D warnings -C control-flow-guard"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked

  supply-chain:
    name: Supply chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20

  fuzz:
    name: Fuzz (smoke, 60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install nightly-2024-10-01 --profile minimal
      - run: cargo +nightly-2024-10-01 install cargo-fuzz --version 0.12.0 --locked
      - name: Run fuzz targets
        working-directory: fuzz
        run: |
          for t in parse_file decode_inner parse_totp; do
            cargo +nightly-2024-10-01 fuzz run "$t" -- -max_total_time=60
          done
