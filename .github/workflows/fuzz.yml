name: Fuzz

on:
  schedule:
    - cron: "0 5 * * 1" # weekly, Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (smoke, 60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install nightly-2024-10-01 --profile minimal
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-fuzz
      - name: Run fuzz targets
        working-directory: fuzz
        run: |
          for t in parse_file decode_inner parse_totp; do
            cargo +nightly-2024-10-01 fuzz run "$t" -- -max_total_time=60
          done
