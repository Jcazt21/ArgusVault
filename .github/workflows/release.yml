name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C control-flow-guard"

jobs:
  windows:
    name: Build and publish (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build -p argus-app --release --locked
      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/argus-app.exe ArgusVault.exe
          $hash = (Get-FileHash ArgusVault.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ArgusVault.exe" | Out-File ArgusVault.exe.sha256 -Encoding ascii
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ArgusVault.exe ArgusVault.exe.sha256 --generate-notes --title "${{ github.ref_name }}"
