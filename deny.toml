# cargo-deny policy. Run: cargo deny check
[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" }, # CI / fuzzing
]

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates pulled in by Slint's winit backend on Linux only (zbus for
# D-Bus, sctk-adwaita for Wayland decorations). Verified absent from the Windows
# build with `cargo tree --target x86_64-pc-windows-msvc -i <crate>`. Revisit when
# Slint/winit move off them.
ignore = [
    "RUSTSEC-2026-0192", # ttf-parser
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    # Argus Vault itself, and Slint under its GPL-3.0-only option (Slint is
    # licensed "GPL-3.0-only OR royalty-free OR commercial"; we use the GPL).
    "GPL-3.0-only",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Argus Vault never talks to the network and never uses OpenSSL.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    { name = "reqwest" },
    { name = "hyper" },
    { name = "ureq" },
    { name = "curl" },
    { name = "tokio" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
